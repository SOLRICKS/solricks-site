<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solricks | Start Automating</title>
  <link rel="icon" type="image/png" href="upload/favicon.png" sizes="64x64">
  <meta name="description" content="Solricks provides AI services, machine learning automation, strategic IT consulting, and AI-powered visual technology for modern businesses." />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    :root {
      --bg: #05070b;
      --line: rgba(255, 255, 255, 0.12);
      --text: #f4f6fb;
      --blue: #316bff;
      --violet: #6d3cff;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: 100%;
      height: 100vh;
      position: relative;
      isolation: isolate;
      background:
        radial-gradient(circle at 78% 14%, rgba(79, 102, 255, 0.18), transparent 22%),
        radial-gradient(circle at 22% 82%, rgba(255, 255, 255, 0.10), transparent 22%),
        linear-gradient(135deg, #07090f 0%, #080a0f 44%, #15171d 100%);
    }

    .page::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.45;
      background:
        linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: linear-gradient(to bottom, black, transparent 82%);
      z-index: -2;
    }

    .shell {
      width: min(100% - 42px, 1680px);
      height: 100vh;
      margin: 0 auto;
    }

    .topbar {
      height: 86px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 18px;
      position: relative;
      z-index: 20;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.025);
      backdrop-filter: blur(18px);
    }

    .topbar-left,
    .topbar-right {
      display: flex;
      align-items: center;
      padding: 0 28px;
    }

    .topbar-left {
      justify-content: flex-start;
    }

    .topbar-right {
      justify-content: flex-end;
      gap: 10px;
    }

    .call-button,
    .arrow-button {
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.055);
      color: var(--white);
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.02em;
      transition: 0.22s ease;
    }

    .call-button {
      min-width: 0;
      gap: 12px;
      /* padding: 0 14px 0 6px; */
	  padding: 0 42px 0 0 !important;
      position: relative;
      overflow: hidden;
    }

    .call-button::before,
    .journey-button::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        110deg,
        transparent 0%,
        transparent 34%,
        rgba(255,255,255,0.35) 48%,
        transparent 62%,
        transparent 100%
      );
      transform: translateX(-120%);
      transition: transform 0.65s cubic-bezier(.22, 1, .36, 1);
      pointer-events: none;
    }

    .call-button:hover::before,
    .journey-button:hover::before {
      transform: translateX(120%);
    }

    .call-avatar-wrap {
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.08);
      position: relative;
      z-index: 2;
    }

    .call-avatar {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center 7px;
      transform: scale(1.9);
    }

    .call-text {
      white-space: nowrap;
      position: relative;
      z-index: 2;
    }

    .arrow-button {
      width: 42px;
      font-size: 18px;
    }

    .call-button:hover,
    .arrow-button:hover {
      background: rgba(255,255,255,0.12);
      transform: translateY(-1px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 220px;
      height: 100%;
      text-decoration: none;
    }

    .brand img {
      display: block;
      width: auto;
      height: 100%;
      max-width: 230px;
      object-fit: contain;
    }

    .hero-frame {
      height: calc(100vh - 86px);
      position: relative;
      overflow: hidden;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 80px 28px 42px;
      background:
        radial-gradient(circle at 78% 42%, rgba(255,255,255,0.13), transparent 18%),
        linear-gradient(135deg, #05070b 0%, #0a0c12 54%, #17191f 100%);
    }

    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.42;
      z-index: 0;
      pointer-events: none;
      filter: contrast(1.08) saturate(0.9) brightness(0.8);
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(5,7,11,0.95), rgba(5,7,11,0.48) 50%, rgba(5,7,11,0.88)),
        radial-gradient(circle at 82% 15%, rgba(72, 88, 255, 0.22), transparent 26%),
        radial-gradient(circle at 23% 80%, rgba(255, 255, 255, 0.12), transparent 24%);
    }

    .hero-robot {
      position: absolute;
      right: 0;
      bottom: -18px;
      z-index: 2;
      width: clamp(560px, 46vw, 810px);
      pointer-events: none;
      isolation: isolate;
    }

    .robot-img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      object-position: bottom center;
      opacity: 0.9;
      filter:
        brightness(0.82)
        contrast(1.08)
        saturate(0.92);
      animation: robotEdgeStroke 4.6s ease-in-out infinite;
      will-change: filter;
    }

    @keyframes robotEdgeStroke {
      0%, 100% {
        filter:
          brightness(0.82)
          contrast(1.08)
          saturate(0.92)
          drop-shadow(-2px -2px 0 rgba(80, 150, 255, 0.00))
          drop-shadow(2px 2px 0 rgba(120, 80, 255, 0.00));
      }

      18% {
        filter:
          brightness(0.86)
          contrast(1.1)
          saturate(0.98)
          drop-shadow(-2px -3px 1px rgba(75, 155, 255, 0.78))
          drop-shadow(-7px -8px 16px rgba(75, 155, 255, 0.26));
      }

      38% {
        filter:
          brightness(0.84)
          contrast(1.1)
          saturate(0.96)
          drop-shadow(3px -1px 1px rgba(80, 165, 255, 0.68))
          drop-shadow(10px -2px 18px rgba(80, 165, 255, 0.22));
      }

      62% {
        filter:
          brightness(0.86)
          contrast(1.1)
          saturate(1)
          drop-shadow(3px 4px 1px rgba(120, 95, 255, 0.68))
          drop-shadow(9px 12px 18px rgba(120, 95, 255, 0.22));
      }

      82% {
        filter:
          brightness(0.85)
          contrast(1.1)
          saturate(0.98)
          drop-shadow(-3px 2px 1px rgba(55, 135, 255, 0.58))
          drop-shadow(-10px 8px 18px rgba(55, 135, 255, 0.18));
      }
    }

    .hero-main {
      position: relative;
      z-index: 3;
      height: 100%;
    }

    .headline {
      position: absolute;
      left: 0;
      top: 34px;
      width: min(72vw, 1120px);
      z-index: 3;
    }

    .headline-line {
      display: flex;
      align-items: center;
      gap: clamp(18px, 0vw, 48px);
      font-size: clamp(84px, 10vw, 184px);
      line-height: 0.92;
      letter-spacing: -0.05em;
      font-weight: 900;
      text-transform: uppercase;
      background: linear-gradient(180deg, #f3f3f3 0%, #a4a4a4 48%, #535353 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-wrap: balance;
      transition: filter 0.25s ease, transform 0.25s ease;
    }

    .headline-line:hover {
      filter: brightness(1.18);
      transform: translateY(-2px);
    }

    .headline-line.offset {
      margin-left: clamp(70px, 20vw, 390px);
      margin-top: 28px;
    }

    .ai-side {
      position: absolute;
      right: 30px;
      top: 80px;
      z-index: 5;
      padding-top: 0;
      text-align: right;
    }

    .ai-label {
      font-size: clamp(92px, 9vw, 170px);
      line-height: 0.85;
      letter-spacing: -0.05em;
      font-weight: 900;
      background: linear-gradient(180deg, #ffffff, #9c9c9c 65%, #646464);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      transition: filter 0.25s ease, transform 0.25s ease;
    }

    .ai-label:hover {
      filter: brightness(1.18);
      transform: translateY(-2px);
    }

    .hero-copy {
      position: absolute;
      left: 28px;
      bottom: 48px;
      z-index: 6;
      max-width: 540px;
    }

    .client-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .avatars {
      display: flex;
      align-items: center;
    }

    .avatar,
    .avatar-more {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid #111318;
      margin-left: -8px;
      background: linear-gradient(135deg, #d9d9d9, #555);
    }

    .avatar:first-child {
      margin-left: 0;
    }

    .avatar:nth-child(2) {
      background: linear-gradient(135deg, #8c6a4f, #2f241f);
    }

    .avatar:nth-child(3) {
      background: linear-gradient(135deg, #b8c8ff, #3f4f90);
    }

    .avatar-more {
      background: #2a2d35;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
    }

    .stars {
      color: #ffc84a;
      font-size: 13px;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    .happy {
      color: #fff;
      font-weight: 800;
      font-size: 14px;
    }

    .hero-copy h2 {
      margin: 0;
      max-width: 540px;
      font-size: clamp(26px, 2.3vw, 42px);
      line-height: 1.15;
      letter-spacing: -0.045em;
      color: #ffffff;
    }

    .hero-copy h2 span {
      color: rgba(255,255,255,0.52);
    }

    .journey-button {
      margin-top: 30px;
      display: inline-grid;
      grid-template-columns: 1fr 56px;
      align-items: center;
      min-height: 58px;
      border: 1px solid #ffffff;
      background: #ffffff;
      color: #07080c;
      font-weight: 900;
      letter-spacing: 0.01em;
      transition: 0.22s ease;
      position: relative;
      overflow: hidden;
    }

    .journey-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.28);
    }

    .journey-text-wrap {
      height: 58px;
      padding: 0 26px;
      display: grid;
      align-items: center;
      position: relative;
      overflow: hidden;
      z-index: 2;
      white-space: nowrap;
    }

    .roll-line {
      grid-area: 1 / 1;
      display: block;
      line-height: 58px;
      transition: transform 0.48s cubic-bezier(.22, 1, .36, 1);
      will-change: transform;
    }

    .roll-line-top {
      transform: translateY(0);
    }

    .roll-line-bottom {
      transform: translateY(115%);
    }

    .journey-button:hover .roll-line-top {
      transform: translateY(-115%);
    }

    .journey-button:hover .roll-line-bottom {
      transform: translateY(0);
    }

    .journey-button i {
      height: 56px;
      width: 56px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #05070b;
      color: #ffffff;
      font-style: normal;
      font-size: 22px;
      position: relative;
      z-index: 2;
      transition: transform 0.25s ease;
    }

    .journey-button:hover i {
      transform: translate(2px, -2px);
    }

    .social-dock {
      position: fixed;
      right: 28px;
      bottom: 92px;
      z-index: 30;
      display: grid;
      gap: 10px;
    }

    .social-link {
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.075);
      color: rgba(255,255,255,0.82);
      font-size: 15px;
      font-weight: 900;
      line-height: 1;
      transition: 0.2s ease;
      backdrop-filter: blur(12px);
    }

    .social-link:hover {
      background: rgba(255,255,255,0.16);
      color: #ffffff;
      transform: translateY(-1px);
    }

    @media (max-width: 1280px) {
      .hero-robot {
        right: -30px;
        width: clamp(520px, 50vw, 760px);
      }

      .ai-side {
        right: 24px;
        top: 92px;
      }
    }

    @media (max-width: 1024px) {
      .shell {
        width: 100%;
      }

      .topbar-left {
        padding-left: 18px;
      }

      .topbar-right {
        padding-right: 18px;
      }

      .headline {
        top: 48px;
        width: 70vw;
      }

      .headline-line {
        font-size: clamp(72px, 11vw, 120px);
      }

      .headline-line.offset {
        margin-left: clamp(120px, 28vw, 290px);
        margin-top: 22px;
      }

      .hero-robot {
        right: -28px;
        bottom: -18px;
        width: clamp(520px, 55vw, 650px);
      }

      .robot-img {
        opacity: 0.82;
      }

      .ai-side {
        right: 28px;
        top: 118px;
      }

      .ai-label {
        font-size: clamp(88px, 13vw, 132px);
      }

      .hero-copy {
        max-width: 470px;
      }

      .hero-copy h2 {
        font-size: clamp(28px, 3.6vw, 38px);
      }
    }

    @media (max-width: 680px) {
      .topbar {
        height: 72px;
        grid-template-columns: 1fr auto 1fr;
        gap: 8px;
      }
	  
	  .topbar-left, .topbar-right {
		display: flex;
		align-items: center;
		padding: 0 15px;
	}

      .brand {
        min-width: auto;
        height: 66px;
		transform: translateX(-50px);
      }

      .brand img {
        max-width: 160px;
      }

      .call-button {
        min-width: auto;
        padding: 0 8px 0 4px;
      }

      .call-text {
        display: none;
      }

      .arrow-button {
        width: 38px;
      }

      .hero-frame {
        height: calc(100vh - 72px);
        padding: 42px 18px 34px;
      }

      .headline {
        left: 18px;
        top: 72px;
        width: calc(100vw - 36px);
      }

      .headline-line {
        font-size: clamp(58px, 17vw, 88px);
        letter-spacing: -0.08em;
        gap: clamp(12px, 3vw, 24px);
      }

      .headline-line.offset {
        margin-left: 0;
        margin-top: 22px;
      }

      .ai-side {
        right: 22px;
        top: 110px;
        z-index: 5;
      }

      .ai-label {
        font-size: 72px;
      }

      .hero-robot {
        right: -74px;
        bottom: 42px;
        width: 390px;
      }

      .robot-img {
        opacity: 0.46;
      }

      .hero-copy {
        left: 18px;
        right: 18px;
        bottom: 34px;
        max-width: none;
      }

      .hero-copy h2 {
        font-size: 26px;
      }

      .client-row {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 18px;
      }

      .journey-button {
        min-height: 52px;
        grid-template-columns: 1fr 52px;
      }

      .journey-text-wrap {
        height: 52px;
        padding: 0 18px;
      }

      .roll-line {
        line-height: 52px;
      }

      .journey-button i {
        width: 52px;
        height: 52px;
      }

      .social-dock {
        right: 18px;
        bottom: 72px;
      }

      .social-link {
        width: 32px;
        height: 32px;
      }
    }
	::selection {
	  background: transparent;
	}
  </style>
</head>

<body>
  <div class="page">
    <div class="shell">
      <header class="topbar">
        <div class="topbar-left"></div>

        <a class="brand" href="https://solricks.com" title="Solricks" aria-label="Solricks home">
          <img src="upload/solricks-logo.png" alt="Solricks logo" />
        </a>

        <div class="topbar-right">
          <a class="call-button" href="mailto:hello@solricks.com">
            <span class="call-avatar-wrap">
              <img class="call-avatar" src="upload/portfolio.jpeg" alt="Portfolio" />
            </span>
            <span class="call-text">Contact</span>
          </a>
          <a class="arrow-button" href="mailto:hello@solricks.com" aria-label="Contact Solricks">↗</a>
        </div>
      </header>

      <main>
        <section class="hero-frame" id="home">
          <video class="hero-video" autoplay muted loop playsinline>
            <source src="upload/hero-bg.mp4" type="video/mp4" />
          </video>

          <div class="hero-overlay" aria-hidden="true"></div>

          <div class="hero-robot" aria-hidden="true">
            <img class="robot-img" src="upload/rob.webp" alt="" />
          </div>

          <div class="hero-main">
            <div class="headline" aria-label="Build With AI">
              <div class="headline-line">BUILD</div>
              <div class="headline-line offset">WITH</div>
            </div>

            <aside class="ai-side">
              <div class="ai-label">AI</div>
            </aside>
          </div>

          <div class="hero-copy">
            <div class="client-row">
              <div class="avatars" aria-hidden="true">
                <span class="avatar"></span>
                <span class="avatar"></span>
                <span class="avatar"></span>
                <span class="avatar-more" id="github-stars">+22</span>
              </div>

              <div>
                <div class="stars">★★★★★</div>
                <div class="happy">AI-ready workflows</div>
              </div>
            </div>

            <h2>
              We help businesses adopt AI, automate operations, and
              <span>build high-quality visual workflows.</span>
            </h2>

            <a class="journey-button" href="mailto:hello@solricks.com" aria-label="Start your AI journey">
              <span class="journey-text-wrap">
                <span class="roll-line roll-line-top">Build Your Workflow</span>
                <span class="roll-line roll-line-bottom" aria-hidden="true">Start Automating</span>
              </span>
              <i>↗</i>
            </a>
          </div>
        </section>
      </main>
    </div>

    <div class="social-dock" aria-label="Social links">
      <a class="social-link" target="_blank" href="https://github.com/SOLRICKS" aria-label="Github" title="Solricks Github"><i class="fa-brands fa-github"></i></a>
      <a class="social-link" target="_blank" href="https://www.patreon.com/c/Solricks" aria-label="Patreon" title="Solricks Patreon"><i class="fa-brands fa-patreon"></i></a>
      <a class="social-link" target="_blank" href="https://civitai.com/user/Solricks" aria-label="Civitai" title="Solricks Civitai"><i class="fa-solid fa-robot"></i></a>
    </div>
  </div>
  <script>
  async function loadGitHubStars() {
    const starsEl = document.getElementById("github-stars");

    if (!starsEl) return;

    try {
      const response = await fetch("https://api.github.com/repos/SOLRICKS/comfyui-solricks", {
        headers: {
          "Accept": "application/vnd.github+json"
        }
      });

      if (!response.ok) {
        throw new Error("GitHub API request failed");
      }

      const repo = await response.json();
      const stars = Number(repo.stargazers_count || 0);

      starsEl.textContent = `+${stars}`;
      starsEl.title = `${stars} GitHub stars`;
    } catch (error) {
      console.warn("Could not load GitHub stars:", error);
      starsEl.textContent = "+22";
    }
  }

  loadGitHubStars();
</script>
</body>
</html>
